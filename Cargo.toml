[workspace]
resolver = "2"
members = [
    "crates/onote-domain",
    "crates/onote-vault-storage",
    "crates/onote-history-backup",
    "crates/onote-metadata-links",
    "crates/onote-search",
    "crates/onote-attachments-import",
    "crates/onote-tasks",
    "crates/onote-latex",
    "crates/onote-latex-sandbox",
    "crates/onote-diagnostics",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "functions", "serde_json"] }

onote-domain = { path = "crates/onote-domain" }
onote-vault-storage = { path = "crates/onote-vault-storage" }
onote-metadata-links = { path = "crates/onote-metadata-links" }
onote-search = { path = "crates/onote-search" }
onote-attachments-import = { path = "crates/onote-attachments-import" }
onote-tasks = { path = "crates/onote-tasks" }
onote-latex = { path = "crates/onote-latex" }
onote-diagnostics = { path = "crates/onote-diagnostics" }

[profile.release]
codegen-units = 1
